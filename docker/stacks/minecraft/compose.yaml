services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    restart: unless-stopped
    labels:
      - homepage.group=Games
      - homepage.name=Minecraft
      - homepage.icon=minecraft.png
      - homepage.description=Paper 1.21.11 — mc.jafet.dev:25565
      - homepage.weight=0
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.11"
      MEMORY: 3G
      USE_AIKAR_FLAGS: "true"
      SERVER_PORT: "25565"
      OVERRIDE_SERVER_PROPERTIES: "false"
    volumes:
      - ./minecraft-data:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
