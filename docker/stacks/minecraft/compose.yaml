services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    labels:
      - homepage.group=Games
      - homepage.name=Minecraft
      - homepage.icon=minecraft.png
      - homepage.description=Fabric 26.2 — mc.jafet.dev:25565
      - homepage.weight=0
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.2"
      MEMORY: 4G
      USE_AIKAR_FLAGS: "true"
      SERVER_PORT: "25565"
      OVERRIDE_SERVER_PROPERTIES: "false"
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        ferrite-core
        luckperms
        essential-commands:beta
        servercore
        zfastnoise
        scalablelux
        clumps
        syncmatica
        death-count
        invview
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      INITIAL_ENABLED_PACKS: "vanilla,minecart_improvements"
    volumes:
      - ./fabric:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
