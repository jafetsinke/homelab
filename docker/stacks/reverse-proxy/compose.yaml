services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Caddy
      - homepage.icon=caddy.png
      - homepage.description=Reverse proxy and TLS
      - homepage.weight=1
    ports:
      - 80:80
      - 443:443
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - authelia
    networks:
      - proxy

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Authelia
      - homepage.icon=authelia.png
      - homepage.href=https://auth.jafet.dev
      - homepage.description=Authentication portal
      - homepage.weight=0
    volumes:
      - ./authelia:/config
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
    networks:
      - proxy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Cloudflare Tunnel
      - homepage.icon=cloudflare.png
      - homepage.description=Secure ingress tunnel
      - homepage.weight=2
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks:
      - proxy
  newt:
    image: fosrl/newt:1.15.0
    container_name: newt
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.jafet.dev
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true

volumes:
  caddy_data:
  caddy_config:
