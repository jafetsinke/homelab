---
theme: auto

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: 'auth.jafet.dev'
      policy: bypass
    - domain: 'dj-pool.jafet.dev'
      policy: bypass
    - domain:
        - 'home.jafet.dev'
        - 'dockhand.jafet.dev'
      policy: one_factor

session:
  name: authelia_session
  same_site: lax
  expiration: 1h
  inactivity: 5m
  cookies:
    - domain: jafet.dev
      authelia_url: https://auth.jafet.dev
      default_redirection_url: https://home.jafet.dev

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
