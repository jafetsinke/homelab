---
theme: auto

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'
        # Cookie only — Beszel (PocketBase) sends bare Authorization tokens that
        # break Authelia's default HeaderAuthorization strategy.
        authn_strategies:
          - name: 'CookieSession'

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain:
        - 'auth.hypha.ee'
        - 'auth.jafet.dev'
      policy: bypass
    - domain: 'dj-pool.hypha.ee'
      policy: bypass
    - domain:
        - 'beszel.hypha.ee'
        - 'beszel.jafet.dev'
      resources:
        - '^/api/beszel/agent-connect([/?].*)?$'
      policy: bypass
    - domain:
        - 'home.hypha.ee'
        - 'dockhand.hypha.ee'
        - 'komodo.hypha.ee'
        - 'beszel.hypha.ee'
        - 'home.jafet.dev'
        - 'dockhand.jafet.dev'
        - 'komodo.jafet.dev'
        - 'beszel.jafet.dev'
      policy: one_factor


session:
  name: authelia_session
  same_site: lax
  expiration: 1h
  inactivity: 5m
  cookies:
    - domain: hypha.ee
      authelia_url: https://auth.hypha.ee
      default_redirection_url: https://home.hypha.ee
    - domain: jafet.dev
      authelia_url: https://auth.jafet.dev
      default_redirection_url: https://home.jafet.dev


storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
