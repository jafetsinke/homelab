# Shared middlewares / transports referenced from container labels as name@file.
http:
  middlewares:
    authentik:
      forwardAuth:
        address: http://authentik-outpost:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # External access is HTTPS (tunnel); force proto for backends/Authentik.
    https-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https

    beszel-body:
      buffering:
        maxRequestBodyBytes: 10485760

  serversTransports:
    beszel:
      forwardingTimeouts:
        dialTimeout: 30s
        responseHeaderTimeout: 360s
        idleConnTimeout: 90s
