# Shared middlewares / transports referenced from container labels as name@file.
http:
  middlewares:
    authelia:
      forwardAuth:
        address: http://authelia:9091/api/authz/forward-auth
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email

    # External access is HTTPS (tunnel); force proto for backends/Authelia.
    https-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https

    beszel-body:
      buffering:
        maxRequestBodyBytes: 10485760

  serversTransports:
    beszel:
      forwardingTimeouts:
        dialTimeout: 30s
        responseHeaderTimeout: 360s
        idleConnTimeout: 90s
