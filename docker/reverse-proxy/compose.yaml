services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Traefik
      - homepage.icon=traefik.png
      - homepage.href=https://traefik.hypha.ee/dashboard/
      - homepage.description=Auth and reverse proxy
      - homepage.weight=1
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.hypha.ee`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=authentik@file
    ports:
      - 80:80
      - 443:443
    environment:
      # Lego (ACME) accepts either naming; set both from one token.
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Host Docker requires API >= 1.40; pin so Traefik's client negotiates correctly.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/acme.json:/data/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - authentik-outpost
      - errorpages
    networks:
      - proxy

  errorpages:
    image: nginx:alpine
    container_name: traefik-errorpages
    restart: unless-stopped
    volumes:
      - ./traefik/errorpages/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./traefik/errorpages/404.html:/usr/share/nginx/html/404.html:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.errorpages.rule=HostRegexp(`^.+\\.hypha\\.ee$`)"
      - traefik.http.routers.errorpages.priority=1
      - traefik.http.services.errorpages.loadbalancer.server.port=80

  authentik-outpost:
    image: ghcr.io/goauthentik/proxy:2026.8.5
    container_name: authentik-outpost
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: https://auth.hypha.ee
      AUTHENTIK_INSECURE: false
      AUTHENTIK_TOKEN: ${AUTHENTIK_TOKEN}
    networks:
      - proxy
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Authentik
      - homepage.icon=authentik.png
      - homepage.href=https://auth.hypha.ee
      - homepage.description=Authentication portal
      - homepage.weight=0
      - traefik.enable=true
      - traefik.http.services.authentik-outpost.loadbalancer.server.port=9000
      # Outpost callback/assets on every protected host (high priority).
      - "traefik.http.routers.authentik-outpost.rule=PathPrefix(`/outpost.goauthentik.io/`)"
      - traefik.http.routers.authentik-outpost.priority=100
      - traefik.http.routers.authentik-outpost.service=authentik-outpost

  newt:
    image: fosrl/newt:1.19.0
    container_name: newt
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.jafet.dev
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
