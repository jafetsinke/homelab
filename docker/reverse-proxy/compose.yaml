services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Traefik
      - homepage.icon=traefik.png
      - homepage.href=https://traefik.hypha.ee/dashboard/
      - homepage.description=Auth and reverse proxy
      - homepage.weight=1
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.hypha.ee`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=authelia@file
    ports:
      - 80:80
      - 443:443
    environment:
      # Lego (ACME) accepts either naming; set both from one token.
      CF_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_ZONE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Host Docker requires API >= 1.40; pin so Traefik's client negotiates correctly.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/acme.json:/data/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - authelia
      - errorpages
    networks:
      - proxy

  errorpages:
    image: nginx:alpine
    container_name: traefik-errorpages
    restart: unless-stopped
    volumes:
      - ./traefik/errorpages/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./traefik/errorpages/404.html:/usr/share/nginx/html/404.html:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.errorpages.rule=HostRegexp(`^.+\\.hypha\\.ee$`)"
      - traefik.http.routers.errorpages.priority=1
      - traefik.http.services.errorpages.loadbalancer.server.port=80

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Caddy
      - homepage.icon=caddy.png
      - homepage.description=Auth and reverse proxy (standby)
      - homepage.weight=2
    # Ports removed — Traefik owns 80/443. Keep container for rollback.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - authelia
    networks:
      - proxy

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    user: "1000:1000"
    restart: unless-stopped
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Authelia
      - homepage.icon=authelia.png
      - homepage.href=https://auth.hypha.ee
      - homepage.description=Authentication portal
      - homepage.weight=0
      - traefik.enable=true
      - "traefik.http.routers.authelia.rule=Host(`auth.hypha.ee`) || Host(`auth.jafet.dev`)"
      - traefik.http.services.authelia.loadbalancer.server.port=9091
    volumes:
      - ./authelia:/config
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
    networks:
      - proxy

  newt:
    image: fosrl/newt:latest
    container_name: newt
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.jafet.dev
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
