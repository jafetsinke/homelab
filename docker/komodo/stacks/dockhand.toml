[[stack]]
name = "dockhand"
deploy = true

[stack.config]
server = "Mycelia"
linked_repo = "homelab"
run_directory = "docker/stacks/dockhand"
config_files = [".env.sops"]
compose_cmd_wrapper = "SOPS_AGE_KEY=\"[[SOPS_AGE_KEY]]\" sops exec-env .env.sops '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["config", "build", "pull", "up"]
