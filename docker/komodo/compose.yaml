services:
  mongo:
    image: mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    # ports:
    #   - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD}

  core:
    image: ghcr.io/moghtech/komodo-core:2
    container_name: komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - 127.0.0.1:9120:9120
    env_file: ./.env
    environment:
      TZ: Etc/UTC
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_HOST: https://komodo.hypha.ee
      KOMODO_FIRST_SERVER_NAME: Mycelia
      KOMODO_TITLE: Komodo
      KOMODO_MONITORING_INTERVAL: "15-sec"
      KOMODO_RESOURCE_POLL_INTERVAL: "1-hr"
      KOMODO_JWT_TTL: "1-day"
      ## Trust the key Periphery writes into the shared keys volume.
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      KOMODO_LOCAL_AUTH: false
      KOMODO_OIDC_ENABLED: true
      KOMODO_OIDC_PROVIDER: https://auth.hypha.ee/application/o/komodo/
      KOMODO_OIDC_REDIRECT_HOST: https://auth.hypha.ee
      KOMODO_OIDC_USE_FULL_EMAIL: true
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.komodo.rule=Host(`komodo.hypha.ee`)
      - traefik.http.services.komodo.loadbalancer.server.port=9120

    volumes:
      ## Attach the Core / Periphery communication keys
      - keys:/config/keys
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ./backups:/backups
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
      ## Optionally mount custom root CA certificate to trust
      # - /path/to/root_ca.crt:/usr/local/share/ca-certificates/root_ca.crt

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2
    init: true
    restart: unless-stopped
    depends_on:
      - core
    env_file: ./.env
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CONNECT_AS: Mycelia
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      ## Must match the bind mount below. Periphery only manages children of this path.
      PERIPHERY_ROOT_DIRECTORY: /home/jafet/git/homelab/docker
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /home/jafet/git/homelab/docker:/home/jafet/git/homelab/docker

volumes:
  # Mongo
  mongo-data:
  mongo-config:
  # Core / Periphery
  keys:

networks:
  proxy:
    external: true
