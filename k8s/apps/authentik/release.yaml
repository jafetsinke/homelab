apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: authentik
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik

  values:
    postgresql:
      enabled: false
    authentik:
      error_reporting:
        enabled: false
      postgresql:
        host: postgres-rw.postgres.svc.cluster.local
        port: 5432
        name: authentik
        user: authentik_user
      email:
        host: smtp.resend.com
        port: 587
        use_tls: true
        from: authentik@jafet.dev
    global:
      envFrom:
        - secretRef:
            name: authentik-env

      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      volumes:
        - name: authentik-data
          persistentVolumeClaim:
            claimName: authentik-data

      volumeMounts:
        - name: authentik-data
          mountPath: /data
