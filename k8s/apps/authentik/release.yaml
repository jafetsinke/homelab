apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: authentik
  releaseName: authentik
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik

  values:
    postgresql:
      enabled: false
    authentik:
      error_reporting:
        enabled: false
      existingSecret:
        secretName: authentik-config
      postgresql:
        host: postgres-rw.database.svc.cluster.local
        port: 5432
        name: authentik
        user: authentik
    global:
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-config
              key: postgres-password
