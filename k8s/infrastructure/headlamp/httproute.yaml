apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-http
  namespace: headlamp
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: http
      kind: Gateway

  hostnames:
    - headlamp.hypha.ee

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-https
  namespace: headlamp
spec:
  parentRefs:
    - name: traefik
      namespace: traefik
      sectionName: https
      kind: Gateway

  hostnames:
    - headlamp.hypha.ee

  rules:
    - backendRefs:
        - name: headlamp
          port: 80
