apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-nvme-worker-01-morchella
spec:
  capacity:
    storage: 32G
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-nvme
  local:
    path: /var/mnt/local-nvme
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker-01-morchella
