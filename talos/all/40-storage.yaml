apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  diskSelector:
    match: system_disk
  maxSize: 32GB
  grow: false
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-nvme
provisioning:
  diskSelector:
    match: system_disk
  minSize: 2GB
  maxSize: 32GB
  grow: true
