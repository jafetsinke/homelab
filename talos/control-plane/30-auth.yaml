apiVersion: v1alpha1
kind: KubeAuthenticationConfig
configuration:
  apiVersion: apiserver.config.k8s.io/v1
  kind: AuthenticationConfiguration
  anonymous:
    conditions:
      - path: /livez
      - path: /readyz
      - path: /healthz
    enabled: true
  jwt:
    - issuer:
        url: "https://auth.hypha.ee/application/o/headlamp/"
        audiences:
          - "O68mNjWiuzPDIFuOrDOzVMoLKgU499MY8IHoXQ0P"
      claimMappings:
        username:
          claim: email
          prefix: "oidc:"
        groups:
          claim: groups
          prefix: "oidc:"
